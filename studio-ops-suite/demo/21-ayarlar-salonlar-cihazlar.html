<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayarlar · Salonlar ve cihazlar · Studio Ops</title><style>


:root{--birincil:#6f8f72;--vurgu:#cdbba0;--arka:#faf7f2;--metin:#2b2622;--ikincil:#8a7a65;
      --ok:#2e6626;--uyari:#e0a422;--kritik:#c23d3d;
      --font-baslik:Georgia,'Times New Roman',serif;
      --font-govde:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}



:root{
  --yan-arka:#2a2420;
  --yan-metin:rgba(255,255,255,.72);
  --yuzey:#fff;
  --cizgi:rgba(30,25,20,.10);
  --cizgi-yumusak:rgba(30,25,20,.06);
  --sayfa-arka:#faf8f5;
  --golge:0 10px 28px rgba(30,25,20,.07);
  --yari:16px;
  --alan-yuk:44px;
  --ok-ikon:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1.5 1.5l4.5 4.5 4.5-4.5' stroke='%238a7a65' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
}
@supports (background: color-mix(in srgb, red 50%, blue)){
  :root{
    --yan-arka:color-mix(in srgb, var(--metin,#2a2420) 88%, #000);
    --sayfa-arka:color-mix(in srgb, var(--arka,#faf8f5) 70%, var(--vurgu,#c4b49a) 12%);
    --cizgi:color-mix(in srgb, var(--metin,#2a2420) 12%, transparent);
    --cizgi-yumusak:color-mix(in srgb, var(--metin,#2a2420) 7%, transparent);
  }
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:var(--sayfa-arka);
  background-image:
    radial-gradient(900px 480px at 92% -10%, color-mix(in srgb, var(--birincil,#89AC76) 10%, transparent), transparent 62%),
    radial-gradient(760px 520px at -10% 50%, color-mix(in srgb, var(--vurgu,#c4b49a) 12%, transparent), transparent 60%);
  background-attachment:fixed;
  color:var(--metin,#2a2420);
  font-family:var(--font-govde,system-ui,-apple-system,sans-serif);
  font-size:16px; line-height:1.5; overflow-x:hidden;
}
img{max-width:100%}
h1,h2,h3{font-family:var(--font-baslik,Georgia,serif); font-weight:normal; margin:0 0 8px; color:var(--metin,#2a2420)}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
a{color:var(--birincil,#89AC76)}
.ikon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;
      stroke-linejoin:round;flex:0 0 auto;overflow:visible}


.uyg{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.yan{position:sticky;top:0;height:100vh;height:100dvh;background:var(--yan-arka);color:#fff;
     display:flex;flex-direction:column;padding:24px 14px 16px;z-index:30;overflow-y:auto}
.yan-marka{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 24px;min-height:44px}
.yan-marka img{max-height:34px;max-width:120px;object-fit:contain}
.yan-ad{font-family:var(--font-baslik,Georgia,serif);font-size:1.15rem;line-height:1.2;color:#fff;
        overflow-wrap:anywhere}
.yan-logo{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;
         padding:8px 14px;min-height:56px;max-width:100%;flex:1}
.yan-logo img{display:block;max-height:44px;max-width:100%;width:auto;height:auto;object-fit:contain}
.yan-menu{display:none}
.sekmeler{display:grid;gap:4px;align-content:start}
.sekme{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;
       background:transparent;color:var(--yan-metin);font:inherit;font-size:.95rem;text-align:left;
       cursor:pointer;min-height:var(--alan-yuk);transition:background .15s,color .15s}
.sekme:hover{background:rgba(255,255,255,.07);color:#fff}
.sekme[aria-selected="true"]{background:var(--birincil,#89AC76);color:#fff}
.yan-alt{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:8px}
.yan-kisi{font-size:.82rem;color:rgba(255,255,255,.62);overflow-wrap:anywhere}
.yan-surum{font-size:.76rem;color:rgba(255,255,255,.5);padding:0 2px;overflow-wrap:anywhere}
.yan-surum.uyari{color:#f3c969;font-weight:600}
.yan-alt button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;
                width:100%;text-align:center}
.yan-alt button:hover{background:rgba(255,255,255,.16)}

#ust-cikis{width:auto;justify-self:start;min-height:34px;padding:5px 14px;font-size:.82rem;font-weight:500;
           background:transparent;border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.75)}
#ust-cikis:hover{background:rgba(255,255,255,.1);color:#fff}

.ana{min-width:0;padding:28px 32px 48px;max-width:1240px;width:100%}
.ana-ust{margin-bottom:20px}
.ana-ustyazi{display:block;color:var(--birincil,#89AC76);font-size:.72rem;font-weight:700;
             letter-spacing:.22em;margin-bottom:6px;text-transform:none}
.ana-baslik{margin:0;font-size:1.9rem;color:var(--metin,#2a2420)}
.sayfa[hidden]{display:none}

.sayfa{display:flex;flex-direction:column;gap:16px}
.sayfa>*{margin-top:0;margin-bottom:0;min-width:0}
.sayfa>h2:first-child{display:none}              
.sayfa>h2:first-child+p.kucuk{margin-top:-8px}


.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--yari);padding:20px;
      box-shadow:var(--golge);min-width:0}
.kart>:first-child{margin-top:0}
.kart>:last-child{margin-bottom:0}
.kart h3{margin-top:0}
.izgara{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--yuzey);border:1px solid var(--cizgi);border-top:3px solid var(--vurgu,#c4b49a);
     border-radius:var(--yari);padding:18px 20px;box-shadow:var(--golge);min-width:0}
.kpi b{display:block;font-size:1.9rem;line-height:1.15;font-weight:600;
       font-family:var(--font-baslik,Georgia,serif)}
.kpi span{color:var(--ikincil,#8a7a65);font-size:.88rem}
.kpi-ust{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.kpi-ikon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
          background:color-mix(in srgb, var(--birincil,#89AC76) 14%, #fff);color:var(--birincil,#89AC76)}
.kpi-ikon .ikon{width:20px;height:20px}


.tablosar{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--yuzey);
          border:1px solid var(--cizgi);border-radius:var(--yari);box-shadow:var(--golge)}
.kart .tablosar{border:0;box-shadow:none;border-radius:0;background:transparent}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--cizgi-yumusak);white-space:nowrap}
th{color:var(--ikincil,#8a7a65);font-weight:600;font-size:.74rem;letter-spacing:.1em;
   background:transparent;border-bottom:1px solid var(--cizgi)}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}

@media (hover:hover){ tbody tr:hover{background:color-mix(in srgb, var(--birincil,#89AC76) 7%, transparent)} }
td.sag,th.sag{text-align:right}


.rozet{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;
       border:1px solid;white-space:nowrap}
.rozet.ok{color:var(--ok,#2e6626);border-color:var(--ok,#2e6626)}
.rozet.uyari{color:#8a6410;border-color:var(--uyari,#e0a422)}
.rozet.kritik{color:var(--kritik,#c23d3d);border-color:var(--kritik,#c23d3d)}
.rozet.sessiz{color:var(--ikincil,#8a7a65);border-color:var(--cizgi)}
.nokta{color:var(--kritik,#c23d3d);font-size:1.1rem;line-height:1}

.serit{padding:12px 16px;border-radius:12px;font-size:.92rem}
.serit.uyari{background:#fdf6e6;border:1px solid var(--uyari,#e0a422)}
.serit.kritik{background:#fbeceb;border:1px solid var(--kritik,#c23d3d)}
.serit.bilgi{background:color-mix(in srgb, var(--birincil,#89AC76) 10%, #fff);border:1px solid var(--birincil,#89AC76)}


label{display:block;font-size:.85rem;color:var(--ikincil,#8a7a65);margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;max-width:100%;min-width:0;padding:10px 14px;border:1px solid var(--cizgi);
  border-radius:10px;font:inherit;background:#fff;color:inherit;min-height:var(--alan-yuk)}

input:not([type=checkbox]):not([type=radio]),select{height:46px;padding-top:0;padding-bottom:0}

input,select,textarea,table input,table select,table textarea{font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--birincil,#89AC76);outline-offset:1px;
  border-color:transparent}

select{-webkit-appearance:none;appearance:none;background-image:var(--ok-ikon);background-repeat:no-repeat;
  background-position:right 14px center;background-size:12px 8px;padding-right:40px;cursor:pointer;
  text-overflow:ellipsis}
select[disabled]{opacity:.6}
input[type=date],input[type=time]{cursor:pointer;min-width:0;-webkit-appearance:none;appearance:none;
  padding-right:12px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{
  cursor:pointer;margin:0 0 0 6px;padding:0}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--birincil,#89AC76);
  flex:0 0 auto}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.satirduzen{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;
            padding:12px 0;border-bottom:1px solid var(--cizgi-yumusak)}
.satirduzen:last-of-type{border-bottom:0}
.satirduzen input,.satirduzen select,.satirduzen textarea{width:auto;flex:1;min-width:120px}
.satirduzen label{margin:0;white-space:nowrap}
.alan-etiket{display:flex;flex-direction:column;gap:4px;flex:1 1 90px;min-width:90px;margin:0}
.alan-etiket.genis{flex:3 1 180px}
.alan-etiket>span{font-size:.8125rem;color:var(--ikincil,#8a7a65)}
.satirduzen .alan-etiket input{width:100%;min-width:0}
button{padding:10px 16px;border-radius:10px;border:1px solid var(--birincil,#89AC76);
  background:var(--birincil,#89AC76);color:#fff;font:inherit;font-weight:600;cursor:pointer;
  min-height:var(--alan-yuk);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  line-height:1.2;transition:filter .15s}
button:hover{filter:brightness(.95)}
button.ikincil{background:#fff;color:var(--metin,#2a2420);border-color:var(--cizgi);font-weight:500}
button.tehlike{background:var(--kritik,#c23d3d);border-color:var(--kritik,#c23d3d)}

button.kara-liste-dugme{background:#111;border-color:#111;color:#fff}
button[disabled]{opacity:.5;cursor:default;filter:none}

.satirici{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.satirici{margin-top:12px}
.satirici>*{min-width:0}

.gezinti{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-top:12px}
.gezinti>div{min-width:0}
.gezinti>div:nth-child(2){flex:1 1 160px;max-width:240px}
.gezinti>div>label:first-child{margin-top:0}
.satirici>div>label:first-child{margin-top:0}


.iskelet{position:relative;min-height:260px;padding:0;color:transparent;overflow:hidden;
         background:#fff;border:1px solid var(--cizgi);border-radius:var(--yari);box-shadow:var(--golge);
         font-size:0;line-height:0}
.iskelet::before{content:"";position:absolute;inset:0;
  background:
    linear-gradient(var(--cizgi-yumusak),var(--cizgi-yumusak)) 20px 24px/32% 16px no-repeat,
    linear-gradient(var(--cizgi-yumusak),var(--cizgi-yumusak)) 20px 64px/92% 12px no-repeat,
    linear-gradient(var(--cizgi-yumusak),var(--cizgi-yumusak)) 20px 94px/84% 12px no-repeat,
    linear-gradient(var(--cizgi-yumusak),var(--cizgi-yumusak)) 20px 124px/90% 12px no-repeat,
    linear-gradient(var(--cizgi-yumusak),var(--cizgi-yumusak)) 20px 154px/62% 12px no-repeat,
    linear-gradient(var(--cizgi-yumusak),var(--cizgi-yumusak)) 20px 194px/78% 12px no-repeat}
.iskelet::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.75) 50%,transparent 75%);
  transform:translateX(-100%);animation:parilti 1.3s ease-in-out infinite}
@keyframes parilti{to{transform:translateX(100%)}}
.yenileniyor{opacity:.55;transition:opacity .15s}
.pencere.titre{animation:titre .4s cubic-bezier(.36,.07,.19,.97) both}
@keyframes titre{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
                 30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.kapat-uyari{flex:0 0 100%;margin:4px 0 0;font-weight:600}

.bos.iskelet{padding:0;font-size:0;line-height:0;color:transparent}
.ayar-kap>.iskelet{min-height:150px}
.pencere .iskelet{box-shadow:none;border:0;min-height:200px}

.vazgec-kart{display:none}
.kart[data-kirli] .vazgec-kart{display:inline-block}
.kart-uyari{display:none}
.kart[data-kirli] .kart-uyari.goster{display:block}
.kart[data-kirli]{border-color:var(--kritik,#c23d3d)}
.kart.titre{animation:titre .4s cubic-bezier(.36,.07,.19,.97) both}
.ana-ust{position:relative}

body.ag-bekle .ana-ust::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--birincil,#89AC76),transparent);background-size:40% 100%;
  background-repeat:no-repeat;animation:ag-bekle 1s linear infinite}
@keyframes ag-bekle{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){body.ag-bekle .ana-ust::after{animation:none;background-size:100% 100%;opacity:.5}}
.erisim-anahtar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 20px;
  padding:14px 16px;margin:0 0 14px;border:1px solid var(--cizgi);border-radius:12px;background:#faf8f4}
.erisim-metin{display:grid;gap:2px;min-width:0}
.erisim-metin .kucuk{margin:0}
.erisim-dugme{min-width:190px;white-space:nowrap}
.erisim-anahtar.kapali{border-color:var(--kritik,#c23d3d)}
.erisim-anahtar b{display:block}
@media (prefers-reduced-motion:reduce){.iskelet::after{animation:none}.pencere.titre,.kart.titre{animation:none}}
.onay-ortu{z-index:80}
.onay-pencere .dugmeler{margin-top:20px}
.onay-pencere p{color:var(--metin,#2a2420)}


.ortu{position:fixed;inset:0;background:rgba(30,26,22,.55);backdrop-filter:blur(2px);display:flex;
      align-items:center;justify-content:center;padding:16px;z-index:50;overflow:hidden}
.ortu[hidden]{display:none}
.pencere{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:600px;
         max-height:90vh;max-height:90dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
         box-shadow:0 30px 70px rgba(0,0,0,.28)}
.pencere.dar{max-width:420px}
.pencere>*{min-width:0}

.pencere .dugmeler{position:sticky;bottom:-24px;background:#fff;margin:16px -24px -24px;
                   padding:12px 24px 16px;border-top:1px solid var(--cizgi-yumusak);z-index:2}
.pencere.dar .dugmeler{margin-left:-24px;margin-right:-24px}

.pencere .kart .dugmeler{margin:16px -20px -20px;padding:12px 20px 16px;background:var(--yuzey,#fff);
                         border-radius:0 0 var(--yari) var(--yari)}


.rz-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--cizgi-yumusak)}
.pencere .rz-kart .dugmeler{position:static;margin:12px 0 0;padding:0;border:0;background:none;border-radius:0}
.rz-form .hata:empty{display:none}
.islem-dugmeleri{display:inline-flex;flex-wrap:wrap;gap:8px}
.islem-grup{margin-top:16px;padding-top:12px;border-top:1px solid var(--cizgi-yumusak)}
.islem-grup h4{margin:0 0 8px;font-size:.78rem;letter-spacing:.06em;color:var(--ikincil,#8a7a65);font-weight:600}
.pencere .kart .islem-grup .dugmeler{position:static;margin:0;padding:0;border:0;background:none;border-radius:0}

.genel-kartlar{display:grid;gap:16px;min-width:0}

.genel-kartlar[hidden]{display:none}
.genel-kartlar>.kart{margin:0}

.genel-kartlar .hata:empty{display:none}
.pencere .genel-kartlar .kart .dugmeler.satir-ici+.hata{margin-top:12px}

.uye-durum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px 0 4px}
.uye-durum-metin{display:inline-flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0}
.uye-durum .uye-islem{margin-left:auto}
.uye-durum .uye-islem button{min-height:0;padding:3px 10px;font-size:.78rem;font-weight:600;line-height:1.4;border-radius:999px}
@media (max-width:760px){.uye-durum .uye-islem button{min-height:44px}}

.pencere .kart .dugmeler.satir-ici{position:static;margin:16px 0 0;padding:0;border:0;background:none;border-radius:0}
.islem-grup .kucuk{margin:8px 0 0}
.pencere h2{margin-top:0}

.kapat{position:sticky;top:0;float:right;margin:-8px -8px 0 8px;background:transparent;border:0;
       color:var(--ikincil,#8a7a65);font-size:1.7rem;line-height:1;padding:0;min-height:44px;min-width:44px;
       z-index:3}
.kapat:hover{filter:none;color:var(--metin,#2a2420)}

body.kaydirma-kilitli{overflow:hidden}


#giris-ortu .pencere,#kilit-ortu .pencere{padding:32px 28px}
#giris-form,#kilit-form{display:grid;gap:4px}
#giris-form label,#kilit-form label{margin:12px 0 6px}
#giris-form label:first-child,#kilit-form label:first-child{margin-top:0}
#giris-ortu .dugmeler,#kilit-ortu .dugmeler{position:static;margin:16px 0 0;padding:0;border:0;background:none}
#giris-logo img{max-height:56px;max-width:100%;width:auto;height:auto;object-fit:contain}

.bos{color:var(--ikincil,#8a7a65);padding:16px 0;font-size:.92rem}
.hata{color:var(--kritik,#c23d3d);font-size:.88rem;margin-top:8px;min-height:1.2em;overflow-wrap:anywhere}

.pencere .dugmeler+.hata{margin-top:32px;position:relative}
.pencere .kart .dugmeler+.hata{margin-top:28px}
@media (max-width:760px){.pencere .dugmeler+.hata,.pencere .kart .dugmeler+.hata{margin-top:12px}}
.kucuk{font-size:.84rem;color:var(--ikincil,#8a7a65)}
p{margin:0 0 8px}


.tk-arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tk-arac select{width:auto;min-width:0;flex:0 1 auto}
.tk-arac .bosluk{flex:1}
.tk-aralik{font-family:var(--font-baslik,Georgia,serif);font-weight:normal;padding:0 8px}
.tk-arti{font-weight:600}
.tk-lejant{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 12px;font-size:.84rem;
           color:var(--ikincil,#8a7a65)}
.tk-lejant-oge{display:inline-flex;align-items:center;gap:6px}
.tk-nokta{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle}
.tk-nokta.bekliyor{background:#fbeceb;border:2px dashed var(--kritik,#c23d3d)}
.tk-sar{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;background:#fff;
        border:1px solid var(--cizgi);border-radius:var(--yari);box-shadow:var(--golge)}
.tk-izgara{display:grid;min-width:100%;width:max-content}

.tk-kose,.tk-baslik{background:#fff;border-bottom:1px solid var(--cizgi);padding:10px 6px;font-size:.85rem}
.tk-kose{position:sticky;left:0;z-index:5}
.tk-baslik{text-align:center;color:var(--ikincil,#8a7a65);border-left:1px solid var(--cizgi-yumusak);
          display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;gap:1px}
.tk-gun{font-size:.85rem}
.tk-tarih{font-size:.78rem;opacity:.85}
.tk-baslik.bugun{color:var(--metin,#2a2420);font-weight:700}
.tk-saatler{position:sticky;left:0;z-index:4;background:#fff;border-right:1px solid var(--cizgi-yumusak)}

(function () {
  var CFG = {"id":"21-ayarlar-salonlar-cihazlar","open":{},"kapali":["esikler", "rozet", "yedekler", "mailler"]};
  var tm;
  function send(o) { o.cd = 1; try { parent.postMessage(o, '*'); } catch (e) {} }
  function toast(m) {
    var t = document.getElementById('cd-toast');
    if (!t) { t = document.createElement('div'); t.id = 'cd-toast'; t.className = 'cd-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = m; t.classList.add('on'); clearTimeout(tm);
    tm = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }
  function gorunur(el) { return !!(el && (el.offsetWidth || el.offsetHeight || el.getClientRects().length)); }
  function sec(sel) {
    var p = String(sel).split('|');
    for (var i = 0; i < p.length; i++) {
      var l = document.querySelectorAll(p[i]);
      for (var j = 0; j < l.length; j++) if (gorunur(l[j])) return l[j];
    }
    return null;
  }
  function kartSekmeAc(ad) {
    var b = document.querySelectorAll('.kart-sekme');
    for (var i = 0; i < b.length; i++) {
      if (b[i].textContent.trim() !== ad) continue;
      var bar = b[i].parentNode, govde = bar.parentNode.querySelector('.kart-govde');
      var hepsi = bar.querySelectorAll('.kart-sekme');
      for (var j = 0; j < hepsi.length; j++) {
        hepsi[j].setAttribute('aria-selected', String(hepsi[j] === b[i]));
        if (govde && govde.children[j]) govde.children[j].hidden = hepsi[j] !== b[i];
      }
      return true;
    }
    return false;
  }
  (function () {
    var l = document.querySelectorAll('.alt-sekme[data-alt]');
    for (var i = 0; i < l.length; i++) if (CFG.kapali.indexOf(l[i].getAttribute('data-alt')) > -1) {
      l[i].setAttribute('aria-disabled', 'true'); l[i].setAttribute('title', 'Bu bölüm önizlemede kapalı');
    }
  })();
  document.addEventListener('click', function (e) {
    var t = e.target; if (!t || !t.closest) return;
    if (t.closest('[aria-disabled=true]')) { e.preventDefault(); e.stopPropagation(); return; }
    var ks = t.closest('.kart-sekme');
    if (ks) { e.preventDefault(); kartSekmeAc(ks.textContent.trim()); return; }
    var yb = t.closest('#yan-menu');
    if (yb) { var y = document.getElementById('yan'); var ac = !y.classList.contains('acik'); y.classList.toggle('acik', ac); yb.setAttribute('aria-expanded', String(ac)); return; }
    var s = t.closest('.sekme, .alt-sekme');
    if (s) { e.preventDefault(); send({ t: 'nav', sayfa: s.getAttribute('data-sayfa') || '', alt: s.getAttribute('data-alt') || '' }); return; }
    var k = t.closest('.pencere .kapat');
    if (k || (t.classList && t.classList.contains('ortu'))) { e.preventDefault(); send({ t: 'back' }); return; }
    for (var sel in CFG.open) {
      var h = t.closest(sel);
      if (h) { e.preventDefault(); send({ t: 'open', to: CFG.open[sel] }); return; }
    }
    var d = t.closest('button, a, [role=button], summary');
    if (d) { e.preventDefault(); toast('Önizlemede yalnız gezinti çalışır. Hiçbir şey kaydedilmez.'); }
  }, true);
  document.addEventListener('submit', function (e) { e.preventDefault(); toast('Önizlemede hiçbir şey kaydedilmez.'); }, true);
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || m.cd !== 1) return;
    if (m.t === 'toast') { toast(m.m); return; }
    if (m.t === 'tema') {
      var ks = ['birincil', 'vurgu', 'arka', 'metin', 'ikincil'], st = document.documentElement.style;
      for (var q = 0; q < ks.length; q++) {
        if (m.v && m.v[ks[q]]) st.setProperty('--' + ks[q], m.v[ks[q]]); else st.removeProperty('--' + ks[q]);
      }
      return;
    }
    var eski = document.querySelector('.cd-hl'); if (eski) eski.classList.remove('cd-hl');
    if (m.t === 'hl') {
      if (m.tab) kartSekmeAc(m.tab);
      var el = sec(m.sel);
      if (el) { el.classList.add('cd-hl'); try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { el.scrollIntoView(); } }
      send({ t: 'hlok', bulundu: !!el });
    }
  });
  send({ t: 'ready', id: CFG.id });
})();
