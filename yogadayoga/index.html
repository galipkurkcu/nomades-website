<style>
:root{
  --bg:#0B0B0E; --surface:#141418; --surface2:#1C1C1C;
  --border:#1E1E22; --text:#FAFAF7; --dim:#777;
  --font:'Space Grotesk',sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#FAFAF7; --surface:#FFFFFF; --surface2:#F0EFE9;
    --border:#E0DDD8; --text:#1C1C1C; --dim:#8A8A82;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.card{
  width:100%; max-width:420px; background:var(--surface);
  border:1px solid var(--border); border-radius:16px; padding:40px 32px;
}
h1{
  font-size:15px; letter-spacing:.08em; color:var(--dim);
  margin-bottom:24px; text-align:center;
}
form{ display:flex; flex-direction:column; gap:14px; }
input[type="password"]{
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  padding:14px 16px; color:var(--text); font-family:var(--font); font-size:16px;
}
button{
  background:var(--text); color:var(--bg); border:none; border-radius:8px;
  padding:14px 16px; font-family:var(--font); font-size:15px; font-weight:600;
  cursor:pointer;
}
button[disabled]{ opacity:.55; cursor:default; }
.msg{ color:#B01C2E; font-size:13px; text-align:center; min-height:16px; }
.note{ color:var(--dim); font-size:12px; text-align:center; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>

<div class="card" id="gate">
  <h1>Korumalı sayfa</h1>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="ŞİFRE" autofocus autocomplete="current-password">
    <button type="submit" id="go">GİRİŞ</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="note" id="note"></div>
</div>

  function b64e(bytes){
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }

  function deriveKey(password){
    return crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']
    ).then(function(base){
      return crypto.subtle.deriveBits({
        name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'
      }, base, 256);
    }).then(function(bits){ return new Uint8Array(bits); });
  }

  function decryptWith(rawKey){
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function(key){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
      })
      .then(function(plain){ return new TextDecoder('utf-8').decode(plain); });
  }

  function render(html){
    document.open();
    document.write(html);
    document.close();
  }

  var cached = null;
  try { cached = sessionStorage.getItem(CACHE); } catch (e) { cached = null; }

  function showGate(){
    gate.style.display = 'block';
    input.focus();
  }

  if (cached) {
    // Anahtar zaten oturumda: kapiyi hic gostermeden coz
    gate.style.display = 'none';
    decryptWith(b64d(cached)).then(render).catch(function(){
      try { sessionStorage.removeItem(CACHE); } catch (e) {}
      showGate();
    });
  } else {
    showGate();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = input.value;
    if (!pw) return;
    button.disabled = true;
    msg.textContent = '';
    note.textContent = 'Cozuluyor, birkac saniye surebilir.';

    deriveKey(pw).then(function(rawKey){
      return decryptWith(rawKey).then(function(html){
        try { sessionStorage.setItem(CACHE, b64e(rawKey)); } catch (e) {}
        render(html);
      });
    }).catch(function(){
      note.textContent = '';
      msg.textContent = 'Hatali sifre.';
      input.value = '';
      button.disabled = false;
      input.focus();
    });
  });
})();
</script>

</body>
</html>
